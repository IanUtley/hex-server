[supervisord]
nodaemon=true
logfile=/tmp/hex-supervisord.log
pidfile=/tmp/hex-supervisord.pid
childlogdir=/tmp
loglevel=info

[unix_http_server]
file=/tmp/hex-supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/hex-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:hconnect]
directory=%(here)s
# Supervisor's stdout is already redirected by restart.sh to the local
# hconnect log and is also the container's Docker logging stream.  Do not tee
# it a second time: that duplicated every HConnect line in hconnect_log.txt.
command=%(here)s/run_hconnect.sh
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:proxy]
directory=%(here)s
command=python3 -u %(here)s/proxy.py 8081
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/proxy_log.txt
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tournament]
directory=%(here)s
command=python3 -u %(here)s/gamemodes/tournament_server.py
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/tournament_log.txt
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:replay]
directory=%(here)s
command=python3 -u %(here)s/replay_server.py
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/replay_log.txt
stdout_logfile_maxbytes=0
redirect_stderr=true
